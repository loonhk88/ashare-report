<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>加密报告</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
background:#eef1f6;color:#1f2a3a;line-height:1.7;font-size:16px;-webkit-text-size-adjust:100%;
display:flex;align-items:center;justify-content:center;padding:20px 16px}
.gate{width:100%;max-width:420px;background:#fff;border-radius:16px;padding:26px 20px 22px;
border:1px solid #e3e8f0;box-shadow:0 8px 28px rgba(20,40,70,.10)}
.gate .badge{display:inline-block;font-size:12px;color:#24507d;background:#eef4fb;
border:1px solid #d6e3f2;padding:4px 12px;border-radius:14px;margin-bottom:12px}
.gate h1{font-size:20px;font-weight:800;color:#1b3a5c;letter-spacing:.4px;margin-bottom:8px}
.gate p.hint{font-size:13.5px;color:#7a8699;margin-bottom:18px}
label{display:block;font-size:13px;font-weight:700;color:#1b3a5c;margin-bottom:7px}
input[type=password]{width:100%;font-size:17px;padding:15px 14px;border:1.5px solid #d6dee9;
border-radius:12px;background:#f9fbfd;color:#1f2a3a;outline:none;-webkit-appearance:none}
input[type=password]:focus{border-color:#24507d;background:#fff;box-shadow:0 0 0 3px rgba(36,80,125,.12)}
button{width:100%;margin-top:14px;font-size:17px;font-weight:800;color:#fff;letter-spacing:1px;
background:linear-gradient(135deg,#1b3a5c 0%,#24507d 100%);border:0;border-radius:12px;
padding:16px 14px;min-height:54px;cursor:pointer;-webkit-tap-highlight-color:transparent;
touch-action:manipulation}
button:active{opacity:.86}
button[disabled]{opacity:.6;cursor:default}
.msg{margin-top:14px;font-size:14px;font-weight:700;min-height:22px;text-align:center}
.msg.err{color:#d6362c}
.msg.busy{color:#24507d}
.foot{margin-top:16px;font-size:12px;color:#9aa6b6;text-align:center;line-height:1.7}
@media (max-width:420px){
  .gate{padding:22px 16px 18px;border-radius:14px}
  .gate h1{font-size:18px}
  input[type=password],button{font-size:16.5px}
}
</style></head>

  <h1>加密报告</h1>
  <p class="hint">输入访问密码即可查看报告。解密在您的浏览器内完成，密码不会被发送到任何服务器。</p>
  <label for="pw">访问密码</label>
  <input id="pw" type="password" inputmode="text" enterkeyhint="go"
         autocomplete="current-password" autocapitalize="off" autocorrect="off"
         spellcheck="false" placeholder="请输入密码" required>
  <button id="go" type="submit">解 锁 查 看</button>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="foot">需要支持 WebCrypto 的现代浏览器（Chrome / Safari / Edge）。<br>密码错误时无法解密，本页不保存任何密码。</div>
</form>

    var salt = b64d(P.salt), iv = b64d(P.iv), ct = b64d(P.ct);
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password),
                                             { name: "PBKDF2" }, false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 200000, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    // AES-GCM 的认证标签在密文尾部（Python 侧把 tag 拼在 ct 后面），AES-GCM 的默认 tagLength 即 128 位
    return await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv, tagLength: 128 }, key, ct);
  }

  async function onGo(password) {
    show("正在本地解密…", "busy");
    go.disabled = true;
    try {
      var buf = await unlock(password);
      var text = new TextDecoder("utf-8").decode(new Uint8Array(buf));
      var doc = fallbackView(text);
      if (doc === null) doc = text;
      document.open();
      document.write(doc);
      document.close();
      return;
    } catch (e) {
      show("密码错误", "err");
    }
    go.disabled = false;
    pw.focus();
    pw.select();
  }

  gate.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var password = pw.value;
    if (!password) { show("请输入密码", "err"); pw.focus(); return; }
    onGo(password);
  });
  // 回车提交由 form + type=submit 原生支持；这里再兜底一次
  pw.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.isComposing) {
      ev.preventDefault();
      if (gate.requestSubmit) gate.requestSubmit(); else gate.dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });
  pw.focus();
})();
</script>
</body></html>
